# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:18.20  # Usa una versión de Node adecuada para Vite/React
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            cd FAKEAIRBNB
            npm install
      - run:
          name: Ejecutar tests
          command: |
            cd FAKEAIRBNB
            npm test

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
